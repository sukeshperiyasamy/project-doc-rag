entity_types_guidance: |
  Classify each entity using one of the following research-oriented types. If no type fits, use `Other`.

  - Project: Research grants, theses, overall studies, or project identifiers
  - Experiment: Specific experimental trials, sessions, runs, or test series (e.g. Experiment X, Session 2)
  - Biomarker: Biological molecules, targets, or disease markers (e.g. NAM, LPS, LTA, bilirubin)
  - Chemical: Reagents, solvents, solutions, ligands, salts (e.g. boronic acid, ethanol, PBS)
  - Material: Nanoparticles, colloidal solutions, metals (e.g. silver nanoparticles, gold nanostars)
  - Substrate: Solid substrates, fabrication platforms, surfaces (e.g. Black Silicon, etched silicon, glass slide)
  - Instrument: Laboratory hardware, spectrometers, detectors, microscopes (e.g. Raman spectrometer, SEM)
  - Instrument_Parameter: Operating parameters, settings (e.g. laser wavelength 785 nm, 532 nm, integration time 10s, laser power 10 mW)
  - Spectral_Peak: Raman peaks, bands, wavenumbers, vibrational modes (e.g. 930 cm-1, 1580 cm-1, D band, G band)
  - Concentration: Numerical concentrations and dilutions (e.g. 0.1 mg/mL, 1 uM, 10 mM)
  - Measurement: Quantitative or qualitative readings, intensities, SERS enhancement factors, signal-to-noise ratios
  - Result: Findings, outcomes, detection statuses (e.g. Detected, Not Detected, limit of detection)
  - Observation: Physical or spectroscopic observations, spectral changes, behavior over time
  - Hypothesis: Scientific conjectures, models, expected mechanisms
  - Problem_Cause: Failure modes, spectral interference, fouling, degradation, background noise, aggregation
  - Method_Protocol: Synthesis protocols, fabrication methods, SERS measurement SOPs, functionalization procedures
  - Author_Paper: Cited papers, researchers, literature references, external study findings
  - Date: Dates or milestones associated with experimental execution

